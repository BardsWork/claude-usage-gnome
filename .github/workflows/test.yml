name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gjs
        run: sudo apt-get update && sudo apt-get install -y gjs
      - name: Run unit tests
        run: TZ=UTC gjs -m tests/usage.test.js
      - name: Check shell scripts
        run: shellcheck install.sh tests/headless.sh docs/screenshot.sh
