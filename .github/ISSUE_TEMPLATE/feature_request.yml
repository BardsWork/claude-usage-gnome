name: Feature request
description: Suggest an idea or a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What are you trying to do that it doesn't help with today?
